name = "brawlverse-rooms"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# sites allowed to open rooms (localhost is always allowed for development)
ALLOWED_ORIGINS = "https://brawlverse.vercel.app"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the ones available on the free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

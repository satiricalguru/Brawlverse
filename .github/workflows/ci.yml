name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Bundle size report
        run: |
          echo "### Build output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/* | sort -h >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  report:
    name: build report
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Write the build report
        run: |
          total=0
          {
            echo "# Build report"
            echo
            echo "Sizes of the production bundle, written by CI after every build."
            echo
            echo "| File | Size |"
            echo "| :--- | ---: |"
            for f in dist/index.html dist/assets/*; do
              size=$(stat -c %s "$f")
              total=$((total + size))
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(awk -v b="$size" 'BEGIN { printf "%.1f KB", b / 1024 }')"
            done
            echo
            echo "Total: $(awk -v b="$total" 'BEGIN { printf "%.1f KB", b / 1024 }')"
          } > .github/build-report.md
      - name: Commit the report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-report.md
          if git diff --staged --quiet; then
            echo "The bundle has not changed since the last report."
            exit 0
          fi
          git commit -m 'ci: record the build report'
          git push
